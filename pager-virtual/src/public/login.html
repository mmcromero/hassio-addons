<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090e17">
  <title>Entrar · Bipou</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:20px; background:#090e17; color:#f1f5f9; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:100%; max-width:430px; background:#131c2e; border:1px solid #30435f; border-radius:22px; padding:28px 24px; }
    h1 { margin:0 0 6px; font-size:1.75rem; }
    p { margin:0 0 26px; color:#b1c0d7; line-height:1.45; }
    label { display:block; font-weight:700; margin:18px 0 8px; }
    input { display:block; width:100%; min-height:56px; font:inherit; font-size:1.1rem; padding:13px 15px; border-radius:10px; background:#0b1220; border:2px solid #4a5c78; color:#f8fafc; }
    input:focus-visible,button:focus-visible { outline:3px solid #93c5fd; outline-offset:3px; }
    button { width:100%; min-height:58px; margin-top:22px; border:none; border-radius:12px; background:#3b82f6; color:white; font-size:1.05rem; font-weight:800; cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; }
    #error { color:#fca5a5; min-height:20px; font-size:.94rem; margin:14px 0 0; }
  </style>
</head>
<body>
  <main>
    <h1>🔔 Bipou</h1>
    <p>Entre para acessar o restaurante ou administrar a plataforma.</p>
    <form id="login-form">
      <label for="login">Usuário</label>
      <input id="login" name="login" type="text" required autocomplete="username" maxlength="120" autocapitalize="none">
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" required autocomplete="current-password">
      <button id="submit" type="submit">Entrar</button>
      <div id="error" role="alert" aria-live="polite"></div>
    </form>
  </main>
  <script>
    fetch('/api/setup/status').then(r => r.json()).then(data => {
      if (data.needs_setup) location.replace('/setup.html');
    }).catch(() => {});
    document.getElementById('login-form').addEventListener('submit', async event => {
      event.preventDefault();
      const button = document.getElementById('submit');
      const error = document.getElementById('error');
      error.textContent = '';
      button.disabled = true;
      button.textContent = 'Entrando...';
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST', credentials: 'same-origin',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            login: document.getElementById('login').value,
            senha: document.getElementById('senha').value
          })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Não foi possível entrar');
        location.replace(data.papel === 'master' ? '/admin.html' : '/kds.html');
      } catch (e) { error.textContent = e.message || 'Falha de conexão'; }
      finally { button.disabled = false; button.textContent = 'Entrar'; }
    });
  </script>
</body>
</html>
