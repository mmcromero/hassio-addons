<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090e17">
  <title>Entrar · Avisaqui</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; min-height:100dvh; display:grid; place-items:center; padding:24px 18px; background:radial-gradient(ellipse at 50% 0%,#14283d 0%,transparent 56%),#090e17; color:#f1f5f9; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:100%; max-width:420px; background:#131c2e; border:1px solid #30435f; border-radius:24px; padding:34px clamp(24px,7vw,38px) 26px; box-shadow:0 24px 64px #0005; }
    .brand-logo-auth { display:block; width:min(100%,340px); height:auto; margin:0 auto 9px; object-fit:contain; background:transparent; }
    h1 { margin:0 0 8px; font-size:1.55rem; letter-spacing:-.025em; line-height:1.2; text-align:center; }
    p { max-width:310px; margin:0 auto 22px; color:#b1c0d7; font-size:.91rem; line-height:1.55; text-align:center; }
    .visually-hidden { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    form { display:grid; gap:12px; }
    input { display:block; width:100%; height:46px; min-height:46px; font:inherit; font-size:.96rem; padding:0 15px; border-radius:11px; background:#0d1626; border:1px solid #40536f; color:#f8fafc; transition:border-color .18s,background .18s,box-shadow .18s; }
    input::placeholder { color:#a3b2c7; opacity:1; }
    input:hover { border-color:#7288a8; }
    input:focus { outline:none; border-color:#60a5fa; background:#101c2e; box-shadow:0 0 0 3px #3b82f633; }
    input:focus-visible,button:focus-visible { outline:2px solid #93c5fd; outline-offset:3px; }
    button { width:100%; min-height:48px; margin-top:6px; border:none; border-radius:11px; background:#3b82f6; color:white; font:inherit; font-size:.98rem; font-weight:750; cursor:pointer; transition:background .18s,transform .18s; }
    button:hover:not(:disabled) { background:#2563eb; }
    button:active:not(:disabled) { transform:translateY(1px); }
    button:disabled { opacity:.6; cursor:wait; }
    #error { color:#fca5a5; min-height:20px; font-size:.88rem; margin:0; text-align:center; }
    @media(max-width:390px) { main { padding:27px 22px 20px; } .brand-logo-auth { width:min(100%,305px); margin-bottom:8px; } }
  </style>
</head>
<body>
  <main>
    <img class="brand-logo-auth" src="./avisaqui-marca-transparente.svg" alt="Avisaqui">
    <p>Entre para acessar o restaurante ou administrar a plataforma.</p>
    <form id="login-form" method="post">
      <label class="visually-hidden" for="login">Usuário</label>
      <input id="login" name="login" type="text" placeholder="Usuário" required autocomplete="username" maxlength="120" autocapitalize="none">
      <label class="visually-hidden" for="senha">Senha</label>
      <input id="senha" name="senha" type="password" placeholder="Senha" required autocomplete="current-password">
      <button id="submit" type="submit">Entrar</button>
      <div id="error" role="alert" aria-live="polite"></div>
    </form>
  </main>
  <script>
    const basePath = location.pathname.startsWith('/avisaqui/') ? '/avisaqui' : '';
    fetch(basePath + '/api/setup/status').then(r => r.json()).then(data => {
      if (data.needs_setup) location.replace(basePath + '/setup.html');
    }).catch(() => {});
    document.getElementById('login-form').addEventListener('submit', async event => {
      event.preventDefault();
      const button = document.getElementById('submit');
      const error = document.getElementById('error');
      error.textContent = '';
      button.disabled = true;
      button.textContent = 'Entrando...';
      try {
        const response = await fetch(basePath + '/api/auth/login', {
          method: 'POST', credentials: 'same-origin',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            login: document.getElementById('login').value,
            senha: document.getElementById('senha').value
          })
        });
        // Erros de proxy podem responder HTML (502/503/504). Nunca exibir HTML ou JSON bruto.
        const contentType = response.headers?.get?.('content-type') || '';
        let data = null;
        if (!contentType || /(?:application\/json|\+json)/i.test(contentType)) {
          try { data = await response.json(); } catch { /* Corpo inválido ou resposta do proxy. */ }
        }
        if (!response.ok) {
          if ([502, 503, 504].includes(response.status))
            throw new Error('Servidor temporariamente indisponível. Tente novamente em alguns instantes.');
          if (response.status === 429)
            throw new Error('Muitas tentativas de acesso. Tente novamente mais tarde.');
          if (response.status === 401 || response.status === 403)
            throw new Error('Login ou senha inválidos');
          throw new Error(typeof data?.error === 'string' && data.error.length <= 180
            ? data.error : 'Não foi possível entrar. Verifique a conexão e tente novamente.');
        }
        if (!data || !['master','gerente','operador'].includes(data.papel))
          throw new Error('Resposta inválida do servidor. Tente novamente mais tarde.');
        // Retorno permitido exclusivamente à aprovação de solicitação Pair-v1.
        // Não seguir URLs externas ou caminhos arbitrários vindos da query.
        const returnTo = new URLSearchParams(location.search).get('return_to');
        const validReturn = typeof returnTo === 'string' &&
          /^\/avisaqui\/autorizar\?solicitacao=[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(returnTo);
        if (validReturn && (data.papel === 'gerente' || data.papel === 'master'))
          location.replace(returnTo);
        else location.replace(basePath + (data.papel === 'master' ? '/admin.html' : '/kds.html'));
      } catch (e) { error.textContent = e.message || 'Falha de conexão'; }
      finally { button.disabled = false; button.textContent = 'Entrar'; }
    });
  </script>
</body>
</html>
