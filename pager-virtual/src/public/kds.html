<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090e17">
  <title>KDS Cozinha & Balcão — Pager Virtual</title>
  <style>
    :root {
      --bg: #090e17;
      --card-bg: #131c2e;
      --card-border: #23334d;
      --text: #f1f5f9;
      --text-muted: #8fa0bc;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --success-hover: #059669;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px 20px 40px;
    }

    /* BARRA SUPERIOR DO KDS */
    .kds-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 20px;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-title h1 {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .brand-title span {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: block;
    }

    .kds-controls {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .metric-tag {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .metric-tag.active-orders {
      color: #38bdf8;
      border-color: rgba(56, 189, 248, 0.4);
    }

    .metric-tag.finished {
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.4);
    }

    /* BOTÃO PRINCIPAL DE CADASTRO MANUAL */
    .btn-sim-order {
      background: var(--primary);
      color: #ffffff;
      border: 1px solid #60a5fa;
      padding: 16px 20px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      min-height: 54px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-sim-order:hover {
      background: rgba(59, 130, 246, 0.2);
      border-color: #60a5fa;
      color: #ffffff;
      transform: translateY(-1px);
    }

    /* GRID DE CARTÕES DE PEDIDOS */
    .orders-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 18px;
    }

    .order-card {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease-out;
      opacity: 1;
      transform: scale(1);
    }

    /* Animação de entrada e saída dos pedidos */
    .order-card.fade-in {
      animation: cardEnter 0.3s ease-out;
    }

    .order-card.fade-out {
      opacity: 0;
      transform: scale(0.85);
    }

    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(-12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .order-card.ready-state {
      border-color: #10b981;
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.3);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .card-id {
      font-size: 1.8rem;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.03em;
    }

    .card-meta {
      font-size: 0.75rem;
      background: #1e293b;
      padding: 4px 8px;
      border-radius: 6px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .status-badge {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 8px;
      border-radius: 4px;
    }

    .status-badge.preparo {
      color: #fbbf24;
    }

    .status-badge.pronto {
      color: #34d399;
    }

    .order-summary {
      font-size: 0.85rem;
      color: #cbd5e1;
      line-height: 1.45;
      margin-bottom: 14px;
      min-height: 48px;
    }

    /* MINIATURA DO QR CODE DO PEDIDO */
    .qr-strip {
      background: #ffffff;
      padding: 8px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      cursor: pointer;
      border: 1px solid #cbd5e1;
      transition: transform 0.15s;
    }

    .qr-strip:hover {
      transform: scale(1.02);
    }

    .qr-thumb {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
    }

    .qr-strip-text {
      color: #0f172a;
      font-size: 0.75rem;
      font-weight: 700;
      line-height: 1.25;
    }

    .qr-strip-text span {
      color: #64748b;
      font-weight: 500;
      display: block;
      margin-top: 2px;
      font-size: 0.7rem;
    }

    /* BOTÕES DE AÇÃO DO CARD */
    .card-actions {
      display: flex;
      gap: 8px;
    }

    .btn-action-kds {
      flex: 1;
      padding: 12px 10px;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
    }

    .btn-call-kds {
      background: var(--success);
      color: white;
    }

    .btn-call-kds:hover {
      background: var(--success-hover);
    }

    .btn-finish-kds {
      background: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
    }

    .btn-finish-kds:hover {
      background: #475569;
    }

    /* MODAL DE QR CODE AMPLIADO (DISPLAY DO CAIXA) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      place-items: center;
      z-index: 10000;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: grid;
    }

    .modal-box {
      background: #1e293b;
      border: 2px solid var(--card-border);
      border-radius: 24px;
      padding: 24px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }

    .modal-qr {
      background: #fff;
      padding: 16px;
      border-radius: 16px;
      width: 220px;
      height: 220px;
      margin: 16px auto;
      display: grid;
      place-items: center;
    }

    .btn-close-modal {
      width: 100%;
      padding: 12px;
      background: #334155;
      border: none;
      color: white;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      border: 2px dashed var(--card-border);
      border-radius: 16px;
    }
    @media print {
      @page { size: auto; margin: 5mm; }
      body > :not(#qr-modal) { display: none !important; }
      #qr-modal { position: static !important; display: block !important; background: #fff !important; padding: 0 !important; color: #000; }
      #qr-modal .modal-box { border: none; box-shadow: none; background: white; color: black; width: 100%; max-width: 100%; padding: 8mm; }
      #qr-modal p, #qr-modal h2 { color: black !important; }
      #qr-modal .modal-qr { border: none; width: 220px; }
      #btn-close-modal, #btn-print-qr { display: none !important; }
      #modal-link-label { color: #000 !important; }
    }
  </style>
</head>
<body>

  <!-- CABEÇALHO DO KDS -->
  <header class="kds-header">
    <div class="brand-title">
      <div style="font-size: 2rem;">🍳</div>
      <div>
        <h1>Pager Virtual · KDS</h1>
        <span>Painel de Atendimento da Cozinha & Balcão</span>
      </div>
    </div>

    <div class="kds-controls">
      <div class="metric-tag active-orders">
        <span id="active-count">0</span> Pedidos Ativos
      </div>
      <div class="metric-tag finished">
        <span id="finished-count">0</span> Finalizados
      </div>

      <button id="btn-add-manual-order" class="btn-sim-order" title="Cadastrar pedido informando a senha">➕ Inserir pedido manual</button>
    </div>
  </header>

  <!-- GRID DE CARTÕES DE PEDIDOS -->
  <main id="orders-grid" class="orders-grid"></main>

  <!-- MODAL DE CADASTRO MANUAL — TOUCH FRIENDLY -->
  <div id="manual-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="manual-title">
    <div class="modal-box">
      <h2 id="manual-title">Inserir pedido manual</h2>
      <p style="color:var(--text-muted); margin:10px 0 16px">Digite somente o número da senha ou do pedido.</p>
      <form id="manual-form">
        <label for="manual-number" style="display:block; text-align:left; margin-bottom:8px; font-weight:700">Número do pedido</label>
        <input id="manual-number" type="number" inputmode="numeric" min="1" step="1" required autocomplete="off" placeholder="Ex.: 44" style="width:100%;font-size:1.8rem;padding:16px;border-radius:12px;border:2px solid #64748b;background:#0f172a;color:#fff;text-align:center;min-height:64px">
        <p id="manual-error" role="alert" style="color:#fca5a5;min-height:24px;margin:12px 0"></p>
        <button id="manual-submit" type="submit" class="btn-sim-order" style="width:100%;justify-content:center">✓ Criar pedido</button>
      </form>
      <button type="button" id="manual-cancel" class="btn-close-modal">Cancelar</button>
    </div>
  </div>

  <!-- MODAL DE QR CODE AMPLIADO (DISPLAY DO CAIXA) -->
  <div id="qr-modal" class="modal-backdrop">
    <div class="modal-box">
      <h2 id="modal-title" style="font-size: 1.4rem;">Display do Caixa</h2>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">
        Aponte a câmera do celular para abrir o Pager do Cliente
      </p>

      <div class="modal-qr">
        <div id="modal-qrcode"></div>
      </div>

      <p id="modal-link-label" style="font-size: 0.72rem; color: #94a3b8; font-family: monospace; word-break: break-all;"></p>
      <button id="btn-print-qr" class="btn-sim-order" style="width:100%;justify-content:center">🖨️ Imprimir QR Code</button>
      <button id="btn-close-modal" class="btn-close-modal">Fechar</button>
    </div>
  </div>

  <script src="./qrcode.min.js"></script>
  <script>
    // --- INTEGRAÇÃO COM API REAL DO PAGER VIRTUAL & SSE ---
    let activeOrders = [];
    let finishedCount = 0;
    let publicBaseUrl = '';
    const appBasePath = window.location.pathname.replace(/\/kds\.html$/, '').replace(/\/$/, '');
    const apiPath = (suffix) => appBasePath + suffix;
    async function carregarConfiguracao() {
      try {
        const resposta = await fetch(apiPath('/api/config/publica'));
        if (resposta.ok) {
          const config = await resposta.json();
          publicBaseUrl = String(config.public_url || '').replace(/\/$/, '');
        }
      } catch (erro) {
        console.warn('URL pública indisponível; usando endereço do KDS', erro);
      }
    }

    // Busca pedidos ativos diretamente do backend SQLite
    async function carregarPedidos() {
      try {
        const res = await fetch(apiPath('/api/pedidos'));
        if (res.ok) {
          const dados = await res.json();
          activeOrders = dados.map(p => ({
            id: String(p.numero),
            dbId: p.id,
            token: p.token,
            items: Array.isArray(p.itens) && p.itens.length > 0 ? p.itens.join(', ') : 'Acompanhamento por senha',
            status: p.status,
            createdAt: p.created_at
          }));
          renderOrders();
        }
      } catch (e) {
        console.warn('Erro ao carregar pedidos da API:', e);
      }
    }

    // Receptor SSE da Cozinha (sincronização em tempo real)
    function conectarSseKds() {
      const sse = new EventSource(apiPath('/api/kds/stream'));
      sse.addEventListener('novo_pedido', (e) => {
        try {
          const p = JSON.parse(e.data);
          const existe = activeOrders.some(o => o.dbId === p.id);
          if (!existe) {
            activeOrders.push({
              id: String(p.numero),
              dbId: p.id,
              token: p.token,
              items: Array.isArray(p.itens) && p.itens.length > 0 ? p.itens.join(', ') : 'Acompanhamento por senha',
              status: p.status,
              createdAt: p.created_at
            });
            renderOrders();
          }
        } catch (err) {
          console.error(err);
        }
      });

      sse.addEventListener('status_alterado', (e) => {
        try {
          const p = JSON.parse(e.data);
          const order = activeOrders.find(o => o.dbId === p.id);
          if (order) {
            order.status = p.status;
            if (p.status === 'entregue') {
              activeOrders = activeOrders.filter(o => o.dbId !== p.id);
              finishedCount++;
            }
            renderOrders();
          }
        } catch (err) {
          console.error(err);
        }
      });
    }

    function getClientUrl(order) {
      const baseUrl = publicBaseUrl || (window.location.origin + appBasePath);
      return `${baseUrl}/cliente.html?token=${encodeURIComponent(order.token)}&pedido=${encodeURIComponent(order.id)}`;
    }

    function getElapsedText(createdAt) {
      const minutes = Math.floor((Date.now() - createdAt) / 60000);
      if (minutes <= 0) return 'Agora mesmo';
      if (minutes === 1) return '1 min atrás';
      return minutes + ' min atrás';
    }

    const grid = document.getElementById('orders-grid');

    function renderOrders() {
      grid.innerHTML = '';
      document.getElementById('active-count').textContent = activeOrders.length;
      document.getElementById('finished-count').textContent = finishedCount;

      if (activeOrders.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <div style="font-size: 2.5rem; margin-bottom: 8px;">🍽️</div>
            <h3>Cozinha em dia! Nenhum pedido pendente.</h3>
            <p style="font-size: 0.85rem; margin-top: 6px;">
              Use <strong>"Inserir pedido manual"</strong> para cadastrar a primeira senha.
            </p>
          </div>
        `;
        return;
      }

      // Ordenação rigorosa FIFO: pedidos mais antigos (menor createdAt) sempre vêm primeiro
      activeOrders.sort((a, b) => a.createdAt - b.createdAt);

      activeOrders.forEach(order => {
        const card = document.createElement('div');
        card.id = 'card-' + order.id;
        card.className = 'order-card ' + (order.status === 'pronto' ? 'ready-state' : '');

        const statusLabel = order.status === 'preparo' ? '🟡 Em Preparo' : '🟢 Chamando no Celular!';
        const timeLabel = getElapsedText(order.createdAt);

        card.innerHTML = `
          <div>
            <div class="card-top">
              <div>
                <div style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase;">Senha</div>
                <div class="card-id">#${order.id}</div>
              </div>
              <div class="card-meta">${timeLabel}</div>
            </div>

            <div class="status-badge ${order.status}">${statusLabel}</div>
            <div class="order-summary">${order.items}</div>

            <!-- Miniatura do QR Code que abre o display expandido -->
            <div class="qr-strip" onclick="openQrModal('${order.id}')" title="Toque para ampliar o QR Code deste pedido">
              <div class="qr-thumb" id="thumb-qr-${order.id}"></div>
              <div class="qr-strip-text">
                📱 QR Code do Pedido #${order.id}
                <span>Toque para ampliar display</span>
              </div>
            </div>
          </div>

          <div class="card-actions">
            ${order.status === 'preparo' ? `
              <button class="btn-action-kds btn-call-kds" onclick="callOrder('${order.id}')">
                🔔 Chamar Pedido!
              </button>
            ` : `
              <button class="btn-action-kds btn-call-kds" onclick="callOrder('${order.id}')" title="Toca o alarme novamente">
                🔔 Re-chamar
              </button>
              <button class="btn-action-kds btn-finish-kds" onclick="finishOrder('${order.id}')">
                ✓ Finalizar & Sumir
              </button>
            `}
          </div>
        `;

        grid.appendChild(card);

        // Renderiza o QR Code em miniatura
        setTimeout(() => {
          const container = document.getElementById('thumb-qr-' + order.id);
          if (container && !container.hasChildNodes()) {
            new QRCode(container, {
              text: getClientUrl(order),
              width: 48,
              height: 48,
              colorDark: '#0f172a',
              colorLight: '#ffffff',
              correctLevel: QRCode.CorrectLevel.L
            });
          }
        }, 10);
      });
    }

    // Chamar e finalizar somente após confirmação do servidor.
    window.callOrder = async function(orderId) {
      const order = activeOrders.find(o => o.id === orderId);
      if (!order || !order.dbId) return;
      try {
        const resposta = await fetch(apiPath(`/api/pedidos/${order.dbId}/status`), {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: 'pronto' })
        });
        if (!resposta.ok) throw new Error('Falha ao chamar pedido');
        order.status = 'pronto';
        renderOrders();
      } catch (erro) {
        alert('Não foi possível avisar o cliente. Verifique a conexão e tente novamente.');
      }
    };

    window.finishOrder = async function(orderId) {
      const order = activeOrders.find(o => o.id === orderId);
      if (!order || !order.dbId) return;
      try {
        const resposta = await fetch(apiPath(`/api/pedidos/${order.dbId}/status`), {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: 'entregue' })
        });
        if (!resposta.ok) throw new Error('Falha ao finalizar pedido');
        // A remoção é idempotente: o SSE pode ter chegado antes da resposta HTTP.
        if (activeOrders.some(o => o.dbId === order.dbId)) {
          activeOrders = activeOrders.filter(o => o.dbId !== order.dbId);
          finishedCount++;
          renderOrders();
        }
      } catch (erro) {
        alert('Não foi possível finalizar. O pedido foi mantido no painel.');
      }
    };

    // CADASTRO MANUAL: sempre espera confirmação da API; nunca inventa token local.
    const manualModal = document.getElementById('manual-modal');
    const manualInput = document.getElementById('manual-number');
    document.getElementById('btn-add-manual-order').addEventListener('click', () => {
      document.getElementById('manual-error').textContent = '';
      manualInput.value = '';
      manualModal.classList.add('open');
      manualInput.focus();
    });
    document.getElementById('manual-cancel').addEventListener('click', () => manualModal.classList.remove('open'));
    document.getElementById('manual-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const numero = Number(manualInput.value);
      const errorEl = document.getElementById('manual-error');
      if (!Number.isSafeInteger(numero) || numero <= 0) {
        errorEl.textContent = 'Digite um número de pedido válido.';
        return;
      }
      const submit = document.getElementById('manual-submit');
      submit.disabled = true;
      submit.textContent = 'Criando pedido...';
      try {
        const resposta = await fetch(apiPath('/api/pedidos'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ numero, itens: [] })
        });
        const pedido = await resposta.json();
        if (!resposta.ok) throw new Error(pedido.error || 'Não foi possível criar pedido.');
        manualModal.classList.remove('open');
        if (!activeOrders.some(o => o.dbId === pedido.id)) {
          activeOrders.push({
            id: String(pedido.numero), dbId: pedido.id, token: pedido.token,
            items: 'Acompanhamento por senha', status: pedido.status, createdAt: pedido.created_at
          });
          renderOrders();
        }
        openQrModal(String(pedido.numero));
      } catch (erro) {
        errorEl.textContent = erro.message || 'Falha de comunicação. Tente novamente.';
      } finally {
        submit.disabled = false;
        submit.textContent = '✓ Criar pedido';
      }
    });

    // Atualiza os minutos decorridos a cada 30 segundos
    setInterval(renderOrders, 30000);

    // Modal de QR Code ampliado
    window.openQrModal = function(orderId) {
      const order = activeOrders.find(o => o.id === orderId);
      if (!order) return;

      const modal = document.getElementById('qr-modal');
      const title = document.getElementById('modal-title');
      const qrContainer = document.getElementById('modal-qrcode');
      const linkLabel = document.getElementById('modal-link-label');

      title.textContent = 'Display do Caixa · Pedido #' + order.id;
      qrContainer.innerHTML = '';
      const url = getClientUrl(order);
      linkLabel.textContent = url;

      new QRCode(qrContainer, {
        text: url,
        width: 190,
        height: 190,
        colorDark: '#0f172a',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });

      modal.classList.add('open');
    };

    document.getElementById('btn-close-modal').addEventListener('click', () => {
      document.getElementById('qr-modal').classList.remove('open');
    });

    document.getElementById('btn-print-qr').addEventListener('click', () => window.print());
    // Carrega a URL configurada antes de permitir o primeiro QR.
    carregarConfiguracao().finally(() => {
      carregarPedidos();
      conectarSseKds();
    });
  </script>
</body>
</html>
