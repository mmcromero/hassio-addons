<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>Acompanhamento do seu Pedido — Burger House</title>
  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --warning: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.15);
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.2);
      --success-border: #059669;
      --focus-ring: #60a5fa;
      --font-scale: 1rem;
    }

    body.high-contrast {
      --bg: #000000;
      --card-bg: #121212;
      --card-border: #ffffff;
      --text-main: #ffffff;
      --text-muted: #e2e8f0;
      --primary: #93c5fd;
      --warning: #fde047;
      --warning-bg: #000000;
      --success: #86efac;
      --success-bg: #000000;
      --success-border: #ffffff;
      --focus-ring: #ffffff;
    }

    body.large-text {
      --font-scale: 1.15rem;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-size: var(--font-scale);
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      transition: background-color 0.2s, color 0.2s;
      overflow-x: hidden;
    }

    /* EFEITO VISÃO PERIFÉRICA: Iluminação nas bordas da tela em amarelo (Edge Lighting) */
    .edge-glow-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 99999;
      opacity: 0;
      transition: opacity 0.25s ease-in-out;
    }

    .edge-glow-overlay.active {
      opacity: 1;
      animation: edgePulseYellow 1.2s infinite ease-in-out;
    }

    @keyframes edgePulseYellow {
      0% {
        box-shadow: inset 0 0 30px 10px rgba(251, 191, 36, 0.5), inset 0 0 65px 20px rgba(245, 158, 11, 0.3);
      }
      50% {
        box-shadow: inset 0 0 55px 18px rgba(251, 191, 36, 1), inset 0 0 100px 35px rgba(245, 158, 11, 0.7);
      }
      100% {
        box-shadow: inset 0 0 30px 10px rgba(251, 191, 36, 0.5), inset 0 0 65px 20px rgba(245, 158, 11, 0.3);
      }
    }

    :focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 3px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .a11y-bar {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 12px;
    }

    .btn-chip {
      background: #1e293b;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      border-radius: 9999px;
      padding: 6px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-chip.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary-hover);
    }

    .app-card {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      transition: all 0.3s ease;
    }

    .restaurant-header {
      background: rgba(0, 0, 0, 0.3);
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--card-border);
    }

    .logo-badge {
      width: 44px;
      height: 44px;
      background: #f97316;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 1.4rem;
      font-weight: 800;
      color: #fff;
    }

    .restaurant-info h1 {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .restaurant-info p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .order-status-card {
      padding: 24px 20px;
      text-align: center;
    }

    .order-number-tag {
      display: inline-block;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 4px;
      font-weight: 600;
    }

    .order-number {
      font-size: 3.8rem;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 16px;
      letter-spacing: -0.04em;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 20px;
    }

    .status-badge.preparo {
      background: var(--warning-bg);
      color: var(--warning);
      border: 1px solid var(--warning);
    }

    .status-badge.pronto {
      background: var(--success-bg);
      color: var(--success);
      border: 2px solid var(--success-border);
      animation: pulseAlert 0.9s infinite;
    }

    .status-badge.entregue {
      background: rgba(148, 163, 184, 0.15);
      color: var(--text-muted);
      border: 1px solid var(--card-border);
    }

    @keyframes pulseAlert {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1.06); box-shadow: 0 0 0 16px rgba(16, 185, 129, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    .flash-alert {
      background: #064e3b !important;
      animation: bgFlash 0.7s infinite alternate;
    }

    @keyframes bgFlash {
      from { border-color: #10b981; }
      to { border-color: #fbbf24; }
    }

    .status-message {
      font-size: 1.1rem;
      color: var(--text-main);
      margin-bottom: 8px;
      line-height: 1.5;
    }

    .sub-message {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    /* Botão Toggle de Alerta Sonoro e Vibração */
    .sound-toggle-btn {
      width: 100%;
      background: #0f172a;
      border: 2px dashed #475569;
      color: var(--text-main);
      padding: 14px 18px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 14px;
      transition: all 0.2s;
    }

    .sound-toggle-btn.enabled {
      background: rgba(16, 185, 129, 0.15);
      border: 2px solid var(--success);
      color: #6ee7b7;
    }

    .sound-toggle-btn.muted {
      background: rgba(239, 68, 68, 0.1);
      border: 2px solid #ef4444;
      color: #fca5a5;
    }

    .order-details {
      border-top: 1px solid var(--card-border);
      padding: 20px;
      background: rgba(0, 0, 0, 0.15);
    }

    .order-details h2 {
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .item-list {
      list-style: none;
    }

    .item-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
      font-size: 0.95rem;
    }

    .item-row:last-child {
      border-bottom: none;
    }

    .item-total {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      font-weight: 700;
      font-size: 1.05rem;
      padding-top: 10px;
      border-top: 1px solid var(--card-border);
    }

    .review-box {
      margin-top: 16px;
      padding: 18px;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 12px;
      text-align: center;
    }

    .star-rating {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 12px 0;
    }

    .star-btn {
      background: none;
      border: none;
      font-size: 1.8rem;
      cursor: pointer;
      color: #fbbf24;
      line-height: 1;
    }

    .coupon-badge {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 16px;
      background: #0f172a;
      border: 1px dashed #fbbf24;
      color: #fef08a;
      font-weight: 700;
      border-radius: 6px;
      font-family: monospace;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>

  <!-- Overlay para o efeito de iluminação periférica nas laterais da tela -->
  <div id="edge-glow" class="edge-glow-overlay" aria-hidden="true"></div>

  <!-- Barra de acessibilidade rápida para o cliente -->
  <aside class="a11y-bar" aria-label="Acessibilidade">
    <button id="toggle-contrast" class="btn-chip" aria-pressed="false" title="Alternar modo de alto contraste">
      Alto Contraste
    </button>
    <button id="toggle-font" class="btn-chip" aria-pressed="false" title="Aumentar tamanho do texto">
      Texto A+
    </button>
  </aside>

  <!-- Região ARIA para anúncios dinâmicos em leitores de tela -->
  <div id="live-announcer" class="sr-only" aria-live="assertive" aria-atomic="true"></div>

  <!-- Cartão do Pager do Cliente -->
  <main id="app-card" class="app-card">
    <header class="restaurant-header">
      <div class="logo-badge" aria-hidden="true">🔔</div>
      <div class="restaurant-info">
        <h1>Pager Virtual</h1>
        <p>Acompanhamento do seu pedido</p>
      </div>
    </header>

    <section class="order-status-card">
      <span class="order-number-tag">Sua Senha de Retirada</span>
      <div class="order-number" id="order-num">—</div>

      <div id="status-badge" class="status-badge preparo">
        <span id="status-icon" aria-hidden="true">⏳</span>
        <span id="status-text">Em Preparo</span>
      </div>

      <p id="status-message" class="status-message">
        Sua comida está sendo preparada com todo cuidado pelo nosso chef!
      </p>

      <p id="sub-message" class="sub-message">
        Você receberá um aviso quando o pedido estiver pronto.
      </p>

      <!-- Botão de Toggle: Ativa e Desativa o som e vibração a qualquer momento -->
      <button id="btn-sound-test" class="sound-toggle-btn" aria-label="Ativar ou desativar alerta sonoro e vibração">
        <span id="sound-icon" aria-hidden="true">🔔</span>
        <span id="sound-label">Toque para ativar alerta sonoro e vibração</span>
      </button>

      <section id="push-guide" hidden aria-live="polite" style="border:1px solid #64748b;border-radius:12px;padding:12px;margin-top:14px;text-align:left;background:#162238;">
        <p id="push-message" style="line-height:1.5;font-size:.9rem"></p>
        <button id="push-enable" type="button" hidden style="margin-top:10px;padding:10px 14px;border:0;border-radius:9px;background:#fbbf24;color:#111827;font-weight:700;cursor:pointer;">Ativar notificações</button>
      </section>

      <!-- Botão de emergência para silenciar alarme enquanto toca -->
      <button id="btn-silence" class="btn-chip" style="display: none; margin: 0 auto 16px; background: #dc2626; color: white;" aria-label="Silenciar toque do pedido">
        🔇 Silenciar Alarme Agora
      </button>
    </section>

    <!-- Produtos opcionais: exibidos apenas quando presentes no QR. -->
    <section class="order-details" id="order-details" aria-labelledby="order-details-title" hidden>
      <h2 id="order-details-title">Itens do pedido</h2>
      <ul class="item-list"></ul>
    </section>
  </main>

  <script>
    // --- IDENTIFICAÇÃO DO PEDIDO E SESSÃO (PÁGINA CASCA) ---
    const urlParams = new URLSearchParams(window.location.search);
    const orderNumber = urlParams.get('pedido') || '—';
    const token = urlParams.get('token') || urlParams.get('sessao') || '';
    const restName = urlParams.get('rest') || 'Pager Virtual';

    document.getElementById('order-num').textContent = '#' + orderNumber;
    const restNameEl = document.querySelector('.restaurant-info h1');
    if (restNameEl && urlParams.get('rest')) {
      restNameEl.textContent = restName;
    }

    // Dados opcionais do pedido vêm da URL e não geram consultas extras.
    const rawItens = urlParams.get('itens');
    if (rawItens) {
      const itens = rawItens.split(',').map(i => i.trim()).filter(Boolean);
      if (itens.length) {
        const lista = document.querySelector('.item-list');
        itens.forEach(item => {
          const li = document.createElement('li');
          li.className = 'item-row';
          li.textContent = item; // Nunca interpretar texto da URL como HTML.
          lista.appendChild(li);
        });
        document.getElementById('order-details').hidden = false;
      }
    }

    // --- ELEMENTOS DO DOM ---
    const appCard = document.getElementById('app-card');
    const edgeGlow = document.getElementById('edge-glow');
    const statusBadge = document.getElementById('status-badge');
    const statusIcon = document.getElementById('status-icon');
    const statusText = document.getElementById('status-text');
    const statusMessage = document.getElementById('status-message');
    const subMessage = document.getElementById('sub-message');
    const liveAnnouncer = document.getElementById('live-announcer');
    const btnSoundTest = document.getElementById('btn-sound-test');
    const soundIcon = document.getElementById('sound-icon');
    const soundLabel = document.getElementById('sound-label');
    const btnSilence = document.getElementById('btn-silence');

    const toggleContrast = document.getElementById('toggle-contrast');
    const toggleFont = document.getElementById('toggle-font');

    // --- SÍNTESE DE ÁUDIO & VIBRAÇÃO HÁPTICA POTENTE ---
    let audioContext = null;
    let alarmInterval = null;
    let isSoundEnabled = false; // Controle de toggle
    let isCurrentlyReady = false;
    let wakeLock = null;
    let backgroundKeeperNode = null;

    // 1. SCREEN WAKE LOCK: Impede que a tela do celular apague/bloqueie sozinha
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator && typeof navigator.wakeLock.request === 'function') {
          wakeLock = await navigator.wakeLock.request('screen');
          console.log('[WakeLock] Tela travada acordada com sucesso.');
          wakeLock.addEventListener('release', () => {
            console.log('[WakeLock] Tela liberada.');
          });
        }
      } catch (err) {
        console.warn('[WakeLock] Falha ou não suportado:', err);
      }
    }

    // Re-solicita o Wake Lock se a aba voltar para o foco
    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'visible' && !wakeLock && !isCurrentlyReady) {
        await requestWakeLock();
      }
    });

    // 2. BACKGROUND AUDIO KEEPER: Mantém o serviço de áudio vivo em segundo plano
    function startBackgroundAudioKeeper(ctx) {
      if (backgroundKeeperNode) return;
      try {
        // Gera silêncio inaudível contínuo via oscilador de 1Hz com ganho 0.00001
        // O Android/iOS interpreta como "tocando mídia" e não suspende o processo em background
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1, ctx.currentTime);
        gain.gain.setValueAtTime(0.00001, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        backgroundKeeperNode = osc;
        console.log('[AudioKeeper] Manutenção de áudio em background iniciada.');
      } catch (e) {
        console.warn('[AudioKeeper] Erro ao iniciar keep-alive:', e);
      }
    }

    function getAudioContext() {
      if (!audioContext) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        audioContext = new AudioCtx();
      }
      if (audioContext.state === 'suspended') {
        audioContext.resume();
      }
      startBackgroundAudioKeeper(audioContext);
      return audioContext;
    }

    // Executa vibração contínua e forte no hardware do aparelho
    function triggerVibration(pattern) {
      try {
        if ('vibrate' in navigator && typeof navigator.vibrate === 'function') {
          // Padrão longo e potente
          navigator.vibrate(pattern);
        }
      } catch (e) {
        console.warn('Vibração não suportada pelo navegador/sistema.', e);
      }
    }

    // Sequência penetrante de pager: ondas harmônicas saturadas (Som alto tipo Buzzer)
    function playChime(isReadyAlert = false) {
      if (!isSoundEnabled) return;
      const ctx = getAudioContext();
      if (!ctx) return;

      const now = ctx.currentTime;
      // Frequências penetrantes de sirene/pager industrial (1200Hz a 1800Hz)
      const notes = isReadyAlert ? [1108, 1318, 1567, 1864] : [880, 1108];
      
      notes.forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        // Onda quadrada/dente de serra tem harmônicos muito mais estridentes que senoide
        osc.type = isReadyAlert ? 'sawtooth' : 'sine';
        osc.frequency.setValueAtTime(freq, now + idx * 0.08);

        // Ganho aumentado no limite de headroom para máxima pressão sonora
        gain.gain.setValueAtTime(0.9, now + idx * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.08 + 0.12);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now + idx * 0.08);
        osc.stop(now + idx * 0.08 + 0.13);
      });

      // Vibração reforçada e agressiva para sentir no bolso mesmo andando
      if (isReadyAlert) {
        triggerVibration([300, 100, 300, 100, 500]);
      } else {
        triggerVibration(200);
      }
    }

    // Loop rápido do alarme: repete a cada 1.2 segundos (cadência de pager insistente)
    function startAlarmLoop() {
      stopAlarmLoop();
      isCurrentlyReady = true;

      // Ativa efeito de visão periférica (Edge Lighting Amarelo)
      edgeGlow.classList.add('active');

      if (isSoundEnabled) {
        playChime(true);
        btnSilence.style.display = 'inline-block';
      }

      alarmInterval = setInterval(() => {
        if (isCurrentlyReady) {
          if (isSoundEnabled) {
            playChime(true);
          } else {
            // Se o som estiver desativado, ainda vibra forte o celular e pisca
            triggerVibration([300, 100, 300, 100, 500]);
          }
        }
      }, 1200);
    }

    function stopAlarmLoop() {
      if (alarmInterval) {
        clearInterval(alarmInterval);
        alarmInterval = null;
      }
      triggerVibration(0);
      edgeGlow.classList.remove('active');
      btnSilence.style.display = 'none';
    }

    // --- TOGGLE DE ATIVAÇÃO / DESATIVAÇÃO DO ALERTA ---
    async function toggleSound() {
      isSoundEnabled = !isSoundEnabled;

      if (isSoundEnabled) {
        getAudioContext();
        await requestWakeLock(); // Trava a tela ligada
        triggerVibration([200, 100, 200]); // Confirmação tátil de ativação
        btnSoundTest.className = 'sound-toggle-btn enabled';
        soundIcon.textContent = '🔊';
        soundLabel.textContent = 'Alerta Máximo Ativo (Tela & Som Protegidos)';
        liveAnnouncer.textContent = 'Alerta sonoro máximo e vibração ativados.';
        playChime(false); // Bipe de confirmação
      } else {
        btnSoundTest.className = 'sound-toggle-btn muted';
        soundIcon.textContent = '🔇';
        soundLabel.textContent = 'Alerta Silenciado (Toque para Ativar)';
        liveAnnouncer.textContent = 'Alerta silenciado.';
        stopAlarmLoop();
        triggerVibration(0);
        if (wakeLock) {
          try { wakeLock.release(); } catch(e){}
          wakeLock = null;
        }
      }
    }

    btnSoundTest.addEventListener('click', toggleSound);

    btnSilence.addEventListener('click', () => {
      stopAlarmLoop();
      appCard.classList.remove('flash-alert');
      liveAnnouncer.textContent = 'Alarme silenciado.';
    });

    // --- TRANSIÇÕES DE ESTADO DO CLIENTE ---
    function applyStatus(status) {
      stopAlarmLoop();
      appCard.classList.remove('flash-alert');

      if (status === 'preparo') {
        isCurrentlyReady = false;
        statusBadge.className = 'status-badge preparo';
        statusIcon.textContent = '⏳';
        statusText.textContent = 'Em Preparo';
        statusMessage.textContent = 'Sua comida está sendo preparada com todo cuidado pelo nosso chef!';
        subMessage.textContent = 'Você receberá um aviso quando o pedido estiver pronto.';
        liveAnnouncer.textContent = 'Pedido ' + orderNumber + ' em preparo.';
      } 
      else if (status === 'pronto') {
        statusBadge.className = 'status-badge pronto';
        statusIcon.textContent = '🔔';
        statusText.textContent = 'PRONTO PARA RETIRADA!';
        statusMessage.innerHTML = '<strong>Seu pedido está no balcão de entrega!</strong>';
        subMessage.textContent = 'Apresente a senha #' + orderNumber + ' no balcão.';
        appCard.classList.add('flash-alert');

        startAlarmLoop();
        liveAnnouncer.textContent = 'Atenção! Seu pedido ' + orderNumber + ' está pronto para retirada!';
      } 
      else if (status === 'entregue') {
        isCurrentlyReady = false;
        statusBadge.className = 'status-badge entregue';
        statusIcon.textContent = '✓';
        statusText.textContent = 'Pedido Entregue';
        statusMessage.textContent = 'Bom apetite! Esperamos que aproveite sua refeição.';
        subMessage.textContent = 'Pedido finalizado com sucesso.';
        liveAnnouncer.textContent = 'Pedido ' + orderNumber + ' retirado com sucesso. Bom apetite!';
      }
    }

    // --- RECEPTOR DE EVENTOS EM TEMPO REAL VIA SSE (NATIVO & ULTRALEVE) ---
    function connectSSE() {
      if (!token) return;
      const appBasePath = window.location.pathname.replace(/\/cliente\.html$/, '').replace(/\/$/, '');
      const sseUrl = `${appBasePath}/api/pedidos/stream/${encodeURIComponent(token)}`;
      const eventSource = new EventSource(sseUrl);

      eventSource.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.status) {
            applyStatus(data.status);
          }
        } catch (e) {
          console.error('Erro ao processar evento SSE:', e);
        }
      };

      eventSource.onerror = (err) => {
        console.warn('Conexão SSE oscilou, reconectando automaticamente...', err);
      };
    }

    // Avisos do sistema complementam o SSE: só solicitamos permissão após toque.
    const pushGuide = document.getElementById('push-guide');
    const pushMessage = document.getElementById('push-message');
    const pushEnable = document.getElementById('push-enable');
    const iosDevice = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    const pushAvailable = window.isSecureContext && 'serviceWorker' in navigator &&
      'PushManager' in window && 'Notification' in window;
    let pushKey = null;
    let pushRegistration = null;

    function showPushGuide(message, allowButton = false) {
      pushMessage.textContent = message;
      pushEnable.hidden = !allowButton;
      pushGuide.hidden = false;
    }

    function decodeVapidKey(value) {
      const padding = '='.repeat((4 - value.length % 4) % 4);
      const bytes = atob((value + padding).replace(/-/g, '+').replace(/_/g, '/'));
      return Uint8Array.from(bytes, c => c.charCodeAt(0));
    }

    async function registerPushSubscription() {
      if (!token || !pushRegistration || !pushKey || Notification.permission !== 'granted') return false;
      const sub = await pushRegistration.pushManager.subscribe({
        userVisibleOnly: true, applicationServerKey: decodeVapidKey(pushKey)
      });
      const result = await fetch('/api/push/assinaturas/' + encodeURIComponent(token), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(sub.toJSON())
      });
      if (!result.ok) throw new Error('Registro de notificação falhou');
      pushGuide.hidden = true; // Experiência pronta: não mostrar instruções desnecessárias.
      return true;
    }

    async function initPush() {
      if (!token || isCurrentlyReady) return;
      const keepOpen = 'Mantenha esta tela aberta e ativa enquanto espera seu pedido para não perder o aviso.';
      if (iosDevice && !standalone) {
        showPushGuide('No iPhone, avisos em segundo plano exigem adicionar o Bipou à Tela de Início e permitir notificações. ' + keepOpen);
        return;
      }
      if (!pushAvailable) {
        showPushGuide('Este navegador ou esta conexão não oferece avisos em segundo plano para o Bipou. ' + keepOpen);
        return;
      }
      if (Notification.permission === 'denied') {
        showPushGuide('As notificações estão bloqueadas no navegador. Libere nas configurações ou ' + keepOpen.toLowerCase());
        return;
      }
      try {
        const config = await fetch('/api/push/public-key').then(r => r.json());
        if (!config.enabled || !config.publicKey) throw new Error('Push não configurado');
        pushKey = config.publicKey;
        pushRegistration = await navigator.serviceWorker.register('/push-sw.js', { scope: '/' });
        if (Notification.permission === 'granted') {
          await registerPushSubscription();
        } else {
          showPushGuide('Quer usar outros aplicativos enquanto espera? Ative as notificações do Bipou para receber avisos em segundo plano. O som depende das configurações do aparelho.', true);
        }
      } catch (error) {
        console.warn('[PUSH] Indisponível', error);
        showPushGuide('Não foi possível ativar avisos em segundo plano neste aparelho. ' + keepOpen);
      }
    }

    pushEnable.addEventListener('click', async () => {
      pushEnable.disabled = true;
      try {
        const permission = await Notification.requestPermission();
        if (permission === 'granted') {
          await registerPushSubscription();
        } else {
          showPushGuide('As notificações não foram permitidas. Mantenha esta tela aberta e ativa enquanto aguarda seu pedido.');
        }
      } catch {
        showPushGuide('Não foi possível ativar as notificações. Mantenha esta tela aberta e ativa enquanto aguarda seu pedido.');
      } finally {
        pushEnable.disabled = false;
      }
    });

    void initPush();

    connectSSE();


    // Acessibilidade
    toggleContrast.addEventListener('click', () => {
      const isHigh = document.body.classList.toggle('high-contrast');
      toggleContrast.classList.toggle('active', isHigh);
      toggleContrast.setAttribute('aria-pressed', isHigh);
    });

    toggleFont.addEventListener('click', () => {
      const isLarge = document.body.classList.toggle('large-text');
      toggleFont.classList.toggle('active', isLarge);
      toggleFont.setAttribute('aria-pressed', isLarge);
    });

    document.querySelectorAll('.star-btn').forEach((btn, index) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.star-btn').forEach((s, idx) => {
          s.style.opacity = idx <= index ? '1' : '0.3';
        });
        liveAnnouncer.textContent = `Avaliação registrada: ${index + 1} estrelas.`;
      });
    });
  </script>
</body>
</html>
