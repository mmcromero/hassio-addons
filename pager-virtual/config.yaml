name: "Pager Virtual"
version: "0.1.20-rc.10"
slug: pager_virtual
description: "Sistema de Pager Virtual ultraleve e em tempo real para restaurantes"
url: "https://github.com/mmcromero/pager-virtual"
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
stage: experimental
timeout: 60
ports:
  8095/tcp: 8095
ports_description:
  8095/tcp: "Painel KDS e Página do Cliente (Web)"
webui: "https://[HOST]:[PORT:8443]/avisaqui/landing.html"
ingress: false
backup: cold
map:
  - share:rw
  - data:rw
  - type: app_config
    read_only: true
options:
  log_level: info
  public_url: ""
  windows_zip_path: "/share/avisaqui/windows/Avisaqui-Windows.zip"
  windows_zip_version: ""
  pong_experimental: false
  pair_v1_enabled: false
  pair_v1_mount_prefix: "/avisaqui"
  pair_v1_approval_ms: ""
  pair_v1_challenge_ms: ""
  pair_v1_recovery_ms: ""
schema:
  log_level: list(info|debug|warn|error)
  public_url: str?
  windows_zip_path: str?
  windows_zip_version: str?
  pong_experimental: bool
  pair_v1_enabled: bool
  pair_v1_mount_prefix: list(/|/avisaqui)
  pair_v1_approval_ms: str?
  pair_v1_challenge_ms: str?
  pair_v1_recovery_ms: str?
