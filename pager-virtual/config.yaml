name: "Pager Virtual"
version: "0.1.7"
slug: pager_virtual
description: "Sistema de Pager Virtual ultraleve e em tempo real para restaurantes"
url: "https://github.com/mmcromero/pager-virtual"
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
stage: experimental
timeout: 60
ports:
  8095/tcp: 8095
ports_description:
  8095/tcp: "Painel KDS e Página do Cliente (Web)"
webui: "http://[HOST]:[PORT:8095]/kds.html"
ingress: false
backup: cold
map:
  - share:rw
  - data:rw
options:
  log_level: info
  public_url: ""
schema:
  log_level: list(info|debug|warn|error)
  public_url: str?
