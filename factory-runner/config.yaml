name: "Fábrica de Ideias - Factory Runner"
version: "0.1.0-rc.72"
slug: fabrica_software
description: "Planejamento read-only integrado ao Portal; execução de código e publicação desabilitadas"
url: "https://github.com/mmcromero/hassio-addons"
arch:
  - aarch64
  - amd64
startup: application
boot: manual
stage: experimental
ingress: true
ingress_port: 8099
ports:
  9876/tcp: null
  9877/tcp: null
ports_description:
  9876/tcp: "API restrita; desabilitada por padrão"
  9877/tcp: "API interna autenticada Portal → Runner; não publicada no host"
options:
  runner_auth_token: ""
  portal_dispatch_token: ""
  workspace_auto_prepare: false
  workspace_sync_enabled: false
  owner_ha_user_id: ""
  owner_ingress_origin: ""
  owner_ingress_enabled: false
  owner_password: ""
  owner_password_confirm: ""
  github_publish_token: ""
schema:
  runner_auth_token: password
  portal_dispatch_token: "password?"
  workspace_sync_enabled: bool
  owner_ha_user_id: "str?"
  owner_ingress_origin: "str?"
  owner_ingress_enabled: bool
  owner_password: "password?"
  owner_password_confirm: "password?"
  github_publish_token: "password?"
  github_read_token: "password?"
  workspace_auto_prepare: bool
