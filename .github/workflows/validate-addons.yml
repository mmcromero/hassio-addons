name: Validar add-ons
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar manifests
        run: |
          python3 -m pip install pyyaml
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          repo = yaml.safe_load(Path('repository.yaml').read_text())
          assert repo.get('name'), 'repository.yaml sem name'
          addons = [p for p in Path('.').iterdir() if p.is_dir() and (p/'config.yaml').exists()]
          assert addons, 'Nenhum add-on encontrado'
          seen = set()
          for addon in addons:
              cfg = yaml.safe_load((addon/'config.yaml').read_text())
              for key in ('name','version','slug','arch'):
                  assert cfg.get(key), f'{addon}: campo {key} ausente'
              assert cfg['slug'] not in seen, f'slug duplicado: {cfg["slug"]}'
              seen.add(cfg['slug'])
              assert (addon/'Dockerfile').is_file() or cfg.get('image'), f'{addon}: falta Dockerfile ou image'
              print(addon, cfg['version'], cfg['arch'])
          PY
      - name: Checar scripts
        run: find . -name run.sh -type f -exec sh -n '{}' ';'
      - name: Detectar arquivos sensíveis rastreados
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import PurePosixPath
          for f in subprocess.check_output(['git','ls-files','-z']).decode().split('\0'):
              if not f: continue
              p = PurePosixPath(f)
              assert p.name not in {'options.json','secrets.yaml','secrets.yml','.env'} and not {'instances','postgres'}.intersection(p.parts), f'Arquivo proibido: {f}'
          PY
  build-arm64:
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build ARM64 (sem publicação)
        run: docker buildx build --platform linux/arm64 --progress plain --load -t evolution-api:test evolution-api/
      - name: Testar inicialização e reinício (PostgreSQL + API)
        run: bash .github/scripts/smoke-evolution.sh
  build-pager-arm64:
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Compilar Pager Virtual ARM64 (sem publicação)
        run: docker buildx build --platform linux/arm64 --progress plain --load -t pager-virtual:ci pager-virtual/
      - name: Smoke da imagem ARM64 com volume persistente e reinício
        run: bash .github/scripts/smoke-pager.sh
      - name: Verificar sintaxe JavaScript do Pager Virtual
        run: |
          node --check pager-virtual/src/server.js
          node --check pager-virtual/src/db.js
          node --check pager-virtual/src/sse.js
          node --check pager-virtual/src/routes/pedidos.js
          node - <<'JS'
          const fs = require('fs');
          const vm = require('vm');
          for (const name of ['kds', 'cliente']) {
            const html = fs.readFileSync('pager-virtual/src/public/' + name + '.html', 'utf8');
            const scripts = html.split('<script>').slice(1).map(part => part.split('</script>')[0]);
            if (!scripts.length) throw new Error(name + ' sem script inline');
            for (const script of scripts) new vm.Script(script, { filename: name + '.html' });
            console.log(name + '.html: JavaScript válido');
          }
          JS

  test-pager-auth:
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependências do Pager Virtual
        working-directory: pager-virtual
        run: npm install --no-audit --no-fund
      - name: Testar autenticação, isolamento, SSE e inicialização
        working-directory: pager-virtual
        run: npm test
