name: Validar add-ons
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      addon:
        description: 'Add-on a validar em ARM64 (execução autorizada)'
        required: true
        type: choice
        options:
          - pager-virtual
          - evolution-api
          - factory-runner
permissions:
  contents: read
concurrency:
  group: validate-addons-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verificar manifests
        run: |
          python3 -m pip install pyyaml
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          repo = yaml.safe_load(Path('repository.yaml').read_text())
          assert repo.get('name'), 'repository.yaml sem name'
          addons = [p for p in Path('.').iterdir() if p.is_dir() and (p/'config.yaml').exists()]
          assert addons, 'Nenhum add-on encontrado'
          seen = set()
          for addon in addons:
              cfg = yaml.safe_load((addon/'config.yaml').read_text())
              for key in ('name','version','slug','arch'):
                  assert cfg.get(key), f'{addon}: campo {key} ausente'
              assert cfg['slug'] not in seen, f'slug duplicado: {cfg["slug"]}'
              seen.add(cfg['slug'])
              assert (addon/'Dockerfile').is_file() or cfg.get('image'), f'{addon}: falta Dockerfile ou image'
              print(addon, cfg['version'], cfg['arch'])
          PY
      - name: Validar cadastro e seleção de add-on
        env:
          SELECTED_ADDON: ${{ github.event_name == 'workflow_dispatch' && inputs.addon || '' }}
        run: python3 .github/scripts/validate-addon-registry.py ${SELECTED_ADDON:+--addon "$SELECTED_ADDON"}
      - name: Checar scripts
        run: find . -name run.sh -type f -exec sh -n '{}' ';'
      - name: Detectar arquivos sensíveis rastreados
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import PurePosixPath
          for f in subprocess.check_output(['git','ls-files','-z']).decode().split('\0'):
              if not f: continue
              p = PurePosixPath(f)
              assert p.name not in {'options.json','secrets.yaml','secrets.yml','.env'} and not {'instances','postgres'}.intersection(p.parts), f'Arquivo proibido: {f}'
          PY
  build-arm64:
    # Build pesado somente sob acionamento manual autorizado.
    if: github.event_name == 'workflow_dispatch' && inputs.addon == 'evolution-api'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: syntax
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build ARM64 (sem publicação)
        run: docker buildx build --platform linux/arm64 --progress plain --load -t evolution-api:test evolution-api/
      - name: Testar inicialização e reinício (PostgreSQL + API)
        run: bash .github/scripts/smoke-evolution.sh
  build-pager-arm64:
    # Build pesado somente sob acionamento manual autorizado.
    if: github.event_name == 'workflow_dispatch' && inputs.addon == 'pager-virtual'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: syntax
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Compilar Pager Virtual ARM64 (sem publicação)
        run: docker buildx build --platform linux/arm64 --progress plain --load -t pager-virtual:ci pager-virtual/
      - name: Smoke da imagem ARM64 com volume persistente e reinício
        run: bash .github/scripts/smoke-pager.sh
      - name: Verificar sintaxe JavaScript do Pager Virtual
        run: |
          node --check pager-virtual/src/server.js
          node --check pager-virtual/src/db.js
          node --check pager-virtual/src/sse.js
          node --check pager-virtual/src/routes/pedidos.js
          node --check pager-virtual/src/pong.js
          node --check pager-virtual/src/public/pong.js
          node - <<'JS'
          const fs = require('fs');
          const vm = require('vm');
          for (const name of ['kds', 'cliente']) {
            const html = fs.readFileSync('pager-virtual/src/public/' + name + '.html', 'utf8');
            const scripts = html.split('<script>').slice(1).map(part => part.split('</script>')[0]);
            if (!scripts.length) throw new Error(name + ' sem script inline');
            for (const script of scripts) new vm.Script(script, { filename: name + '.html' });
            console.log(name + '.html: JavaScript válido');
          }
          JS

  test-pager-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: syntax
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detectar necessidade de testes do Pager
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          BEFORE_SHA: ${{ github.event.before || '' }}
        run: |
          set -euo pipefail
          echo "run=true" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == "pull_request" && "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            BASE="$BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" && "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ && ! "$BEFORE_SHA" =~ ^0{40}$ ]]; then
            BASE="$BEFORE_SHA"
          else
            echo "Sem base confiavel: executar testes completos."
            exit 0
          fi
          if ! git cat-file -e "$BASE^{commit}"; then
            echo "Base indisponivel: executar testes completos."
            exit 0
          fi
          if git diff --name-only "$BASE" HEAD -- pager-virtual/ .github/workflows/validate-addons.yml .github/scripts/validate-addon-registry.py .github/addon-registry.json | grep -q .; then
            echo "Alteracao relevante: executar testes do Pager."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Sem alteracao relevante: manter job presente e dispensar npm."
          fi
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run != 'false'
        with:
          node-version: '22'
      - name: Instalar dependências do Pager Virtual
        if: steps.scope.outputs.run != 'false'
        working-directory: pager-virtual
        run: npm ci --no-audit --no-fund
      - name: Testar autenticação, isolamento, SSE e inicialização
        if: steps.scope.outputs.run != 'false'
        working-directory: pager-virtual
        run: npm test

  build-factory-runner-arm64:
    # Heavy ARM64 build requires explicit manual selection, never automatic on push/PR.
    if: github.event_name == 'workflow_dispatch' && inputs.addon == 'factory-runner'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: syntax
    steps:
      - uses: actions/checkout@v4
      - name: Test Factory Runner security behavior (no credentials)
        run: |
          python3 -m unittest discover -s factory-runner/tests -p 'test_factory_runner_security.py' -v
          python3 -m py_compile factory-runner/server.py factory-runner/autonomous_dev.py
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build restricted Factory Runner ARM64 (no publish)
        run: docker buildx build --platform linux/arm64 --progress plain --load -t factory-runner:rc-test factory-runner/
