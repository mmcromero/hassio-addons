---
configuration:
  log_level:
    name: Log level
    description: >-
      Controls the level of log details the app provides.
  ssl:
    name: SSL
    description: >-
      Enables/Disables SSL (HTTPS) on the web interface.
  certfile:
    name: Certificate file
    description: >-
      The certificate file to use for SSL. Note that this file must
      exist in the /ssl/ folder.
  keyfile:
    name: Private key file
    description: >-
      The private key file to use for SSL. Note that this file must
      exist in the /ssl/ folder.
  request_size_limit:
    name: Size limit of HTTP requests
    description: >-
      Optionally set the size limit of HTTP requests on the API of
      Vaultwarden. This might be needed to support larger imports.
      The default is 10485760, which is 10MB.
  allow_signups:
    name: Allow temporary account registration
    description: Enable only while creating the first owner account; turn off immediately afterward.
  domain:
    name: Public HTTPS URL
    description: Full external URL, for example https://vault.example.com; leave blank until the HTTPS proxy is configured.
