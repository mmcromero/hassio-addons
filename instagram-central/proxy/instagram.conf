# Central Instagram — generated, NOT installed; certificate SAN must cover instagram.romeropi.duckdns.org.
# /share/nginx_proxy/instagram.conf, via customize.servers (HTTP context).
# Reuses existing HTTPS listener 443 (external URL https://instagram.romeropi.duckdns.org:8443); no new public port.
limit_req_zone $binary_remote_addr zone=ig_central_login:1m rate=5r/m;
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name instagram.romeropi.duckdns.org;
    ssl_certificate /ssl/fullchain.pem;
    ssl_certificate_key /ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    access_log off;
    error_log /dev/null;
    server_tokens off;
    if ($http_host !~* "^instagram\.romeropi\.duckdns\.org:8443$") { return 421; }
    if ($ssl_server_name != "instagram.romeropi.duckdns.org") { return 421; }
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 256k;
    client_header_timeout 15s;
    client_body_timeout 30s;
    keepalive_timeout 15s;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header Forwarded "";
    proxy_set_header Connection "";
    proxy_redirect off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_buffering off;
    proxy_cache off;
    location = / {
        limit_except GET { deny all; }
        proxy_pass http://45c28620-umdoislab-instagram:8099;
    }
    location = /panel {
        limit_except GET { deny all; }
        proxy_pass http://45c28620-umdoislab-instagram:8099;
    }
    location = /panel/account-context {
        limit_except GET { deny all; }
        proxy_pass http://45c28620-umdoislab-instagram:8099;
    }
    location = /panel/automation/policy {
        limit_except POST { deny all; }
        proxy_pass http://45c28620-umdoislab-instagram:8099;
    }
    location = /panel/handoff {
        limit_except POST { deny all; }
        proxy_pass http://45c28620-umdoislab-instagram:8099;
    }
    location = /panel/meta/check {
        limit_except POST { deny all; }
        proxy_pass http://45c28620-umdoislab-instagram:8099;
    }
    location = /panel/meta/subscribe {
        limit_except POST { deny all; }
        proxy_pass http://45c28620-umdoislab-instagram:8099;
    }
    location = /auth/login {
        limit_except POST { deny all; }
        client_max_body_size 4k;
        limit_req zone=ig_central_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://45c28620-umdoislab-instagram:8099;
    }
    location = /auth/logout {
        limit_except POST { deny all; }
        proxy_pass http://45c28620-umdoislab-instagram:8099;
    }
    location = /oauth/meta/status {
        limit_except GET { deny all; }
        proxy_pass http://45c28620-umdoislab-instagram:8099;
    }
    location = /oauth/meta/start {
        limit_except GET { deny all; }
        proxy_pass http://45c28620-umdoislab-instagram:8099;
    }
    location = /oauth/meta/callback {
        limit_except GET { deny all; }
        proxy_read_timeout 60s;
        proxy_pass http://45c28620-umdoislab-instagram:8099;
    }
    location = /editorial {
        limit_except GET { deny all; }
        proxy_pass http://45c28620-umdoislab-instagram:8099;
    }
    location = /editorial/ {
        limit_except GET { deny all; }
        proxy_pass http://45c28620-umdoislab-instagram:8099;
    }
    location = /editorial/editorial.js {
        limit_except GET { deny all; }
        proxy_pass http://45c28620-umdoislab-instagram:8099;
    }
    location = /editorial/editorial.css {
        limit_except GET { deny all; }
        proxy_pass http://45c28620-umdoislab-instagram:8099;
    }
    location = /editorial/api/csrf {
        limit_except GET { deny all; }
        proxy_pass http://45c28620-umdoislab-instagram:8099;
    }
    location = /editorial/api/state {
        limit_except GET { deny all; }
        proxy_pass http://45c28620-umdoislab-instagram:8099;
    }
    location = /editorial/api/drafts {
        limit_except POST { deny all; }
        proxy_pass http://45c28620-umdoislab-instagram:8099;
    }
    location = /editorial/api/media {
        limit_except POST { deny all; }
        client_max_body_size 25m;
        proxy_pass http://45c28620-umdoislab-instagram:8099;
    }
    location = /accounts {
        limit_except GET POST { deny all; }
        client_max_body_size 4k;
        proxy_pass http://45c28620-umdoislab-instagram:8099;
    }
    location ~ "^/accounts/[a-z][a-z0-9_-]{1,39}$" {
        limit_except GET { deny all; }
        proxy_pass http://45c28620-umdoislab-instagram:8099;
    }
    location ~ "^/accounts/[a-z][a-z0-9_-]{1,39}/$" {
        limit_except GET { deny all; }
        proxy_pass http://45c28620-umdoislab-instagram:8099;
    }
    location ~ "^/accounts/[a-z][a-z0-9_-]{1,39}/panel$" {
        limit_except GET { deny all; }
        proxy_pass http://45c28620-umdoislab-instagram:8099;
    }
    location ~ "^/accounts/[a-z][a-z0-9_-]{1,39}/panel/account\-context$" {
        limit_except GET { deny all; }
        proxy_pass http://45c28620-umdoislab-instagram:8099;
    }
    location ~ "^/accounts/[a-z][a-z0-9_-]{1,39}/panel/automation/policy$" {
        limit_except POST { deny all; }
        proxy_pass http://45c28620-umdoislab-instagram:8099;
    }
    location ~ "^/accounts/[a-z][a-z0-9_-]{1,39}/panel/handoff$" {
        limit_except POST { deny all; }
        proxy_pass http://45c28620-umdoislab-instagram:8099;
    }
    location ~ "^/accounts/[a-z][a-z0-9_-]{1,39}/panel/meta/check$" {
        limit_except POST { deny all; }
        proxy_pass http://45c28620-umdoislab-instagram:8099;
    }
    location ~ "^/accounts/[a-z][a-z0-9_-]{1,39}/panel/meta/subscribe$" {
        limit_except POST { deny all; }
        proxy_pass http://45c28620-umdoislab-instagram:8099;
    }
    location ~ "^/accounts/[a-z][a-z0-9_-]{1,39}/auth/logout$" {
        limit_except POST { deny all; }
        proxy_pass http://45c28620-umdoislab-instagram:8099;
    }
    location ~ "^/accounts/[a-z][a-z0-9_-]{1,39}/oauth/meta/status$" {
        limit_except GET { deny all; }
        proxy_pass http://45c28620-umdoislab-instagram:8099;
    }
    location ~ "^/accounts/[a-z][a-z0-9_-]{1,39}/oauth/meta/start$" {
        limit_except GET { deny all; }
        proxy_pass http://45c28620-umdoislab-instagram:8099;
    }
    location ~ "^/accounts/[a-z][a-z0-9_-]{1,39}/editorial$" {
        limit_except GET { deny all; }
        proxy_pass http://45c28620-umdoislab-instagram:8099;
    }
    location ~ "^/accounts/[a-z][a-z0-9_-]{1,39}/editorial/$" {
        limit_except GET { deny all; }
        proxy_pass http://45c28620-umdoislab-instagram:8099;
    }
    location ~ "^/accounts/[a-z][a-z0-9_-]{1,39}/editorial/editorial\.js$" {
        limit_except GET { deny all; }
        proxy_pass http://45c28620-umdoislab-instagram:8099;
    }
    location ~ "^/accounts/[a-z][a-z0-9_-]{1,39}/editorial/editorial\.css$" {
        limit_except GET { deny all; }
        proxy_pass http://45c28620-umdoislab-instagram:8099;
    }
    location ~ "^/accounts/[a-z][a-z0-9_-]{1,39}/editorial/api/csrf$" {
        limit_except GET { deny all; }
        proxy_pass http://45c28620-umdoislab-instagram:8099;
    }
    location ~ "^/accounts/[a-z][a-z0-9_-]{1,39}/editorial/api/state$" {
        limit_except GET { deny all; }
        proxy_pass http://45c28620-umdoislab-instagram:8099;
    }
    location ~ "^/accounts/[a-z][a-z0-9_-]{1,39}/editorial/api/drafts$" {
        limit_except POST { deny all; }
        proxy_pass http://45c28620-umdoislab-instagram:8099;
    }
    location ~ "^/accounts/[a-z][a-z0-9_-]{1,39}/editorial/api/media$" {
        limit_except POST { deny all; }
        client_max_body_size 25m;
        proxy_pass http://45c28620-umdoislab-instagram:8099;
    }
    location ~ "^/editorial/media/[0-9a-f]{32}$" {
        limit_except GET { deny all; }
        proxy_pass http://45c28620-umdoislab-instagram:8099;
    }
    location ~ "^/editorial/api/posts/[0-9a-f]{32}/(approve|schedule|cancel)$" {
        limit_except POST { deny all; }
        proxy_pass http://45c28620-umdoislab-instagram:8099;
    }
    location ~ "^/accounts/[a-z][a-z0-9_-]{1,39}/editorial/media/[0-9a-f]{32}$" {
        limit_except GET { deny all; }
        proxy_pass http://45c28620-umdoislab-instagram:8099;
    }
    location ~ "^/accounts/[a-z][a-z0-9_-]{1,39}/editorial/api/posts/[0-9a-f]{32}/(approve|schedule|cancel)$" {
        limit_except POST { deny all; }
        proxy_pass http://45c28620-umdoislab-instagram:8099;
    }
    location / { return 404; }
}
